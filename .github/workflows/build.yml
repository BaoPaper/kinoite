name: Build Custom Kinoite 44

on:
  push:
    branches: [ main, master ]
  schedule:
    # 每天北京时间早上 06:00 (UTC 22:00) 自动拉取 Fedora 官方安全更新并重新构建
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发构建

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: kinoite
  IMAGE_TAG: "44"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 允许推送到 GitHub 容器注册表 (GHCR)
      id-token: write

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Cosign 签名工具
        uses: sigstore/cosign-installer@v3

      - name: 3. 登录 GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 4. 使用 Podman 编译系统镜像
        run: |
          FULL_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          podman build --pull=always -f Containerfile -t "${FULL_IMAGE}" .

      - name: 5. 推送镜像到 GHCR 并获取唯一哈希摘要 (Digest)
        id: push_image
        run: |
          FULL_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          podman push --digestfile=/tmp/digest.txt "${FULL_IMAGE}"
          DIGEST=$(cat /tmp/digest.txt)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: 6. 使用私钥对镜像进行防篡改加密签名
        env:
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE_WITH_DIGEST="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push_image.outputs.digest }}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_WITH_DIGEST}"
