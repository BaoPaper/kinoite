name: Build Custom Kinoite 44

on:
  push:
    branches: [ main, master ]
  schedule:
    # 每天北京时间早上 06:00 (UTC 22:00) 自动拉取 Fedora 官方安全更新并重新构建
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发构建

# 同一个分支的构建串行执行，避免 cron 和 push 同时推送 :44 造成 tag 竞争
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # 注意：容器镜像仓库名必须全小写，而 GitHub 用户名允许大写（如 BaoPaper）。
  # 所以这里不写死 ghcr.io/${{ github.repository_owner }}，而是在下面的步骤里转成小写。
  IMAGE_NAME: kinoite
  IMAGE_TAG: "44"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 允许推送到 GitHub 容器注册表 (GHCR)
      id-token: write

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 1.1 生成全小写的镜像地址与认证文件路径
        # GHCR 要求 repository name 全小写；github.repository_owner 会保留原始大小写
        # REGISTRY_AUTH_FILE：让 podman 使用 ~/.docker/config.json，
        # 这样后面的 cosign 也能读到同一份登录凭据（cosign 不读 podman 默认的 auth.json）
        run: |
          mkdir -p "$HOME/.docker"
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$HOME/.docker/config.json" >> "$GITHUB_ENV"

      - name: 1.2 释放 Runner 磁盘空间
        # ubuntu-latest 默认只有约 14GB 可用空间，Kinoite 基础镜像 + dnf 安装容易触发
        # "no space left on device"。这里删掉构建用不到的大型预装工具链。
        run: |
          echo "== 清理前 =="
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /opt/az \
            /usr/share/swift
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "== 清理后 =="
          df -h /

      - name: 2. 安装 Cosign 签名工具
        uses: sigstore/cosign-installer@v3

      - name: 3. 登录 GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 4. 使用 Podman 编译系统镜像
        run: |
          FULL_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          podman build --pull=always -f Containerfile -t "${FULL_IMAGE}" .

      - name: 5. 先推送到带日期的一次性 tag（不动 :44）
        # 目的：只有签名 + 验签都通过后，才移动 :44。
        # 否则中途失败会把 :44 指向一个没有签名的镜像，客户端 bootc upgrade 会直接报验签失败。
        id: push_image
        run: |
          FULL_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          DATE_TAG="${IMAGE_TAG}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          DATE_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DATE_TAG}"
          podman tag "${FULL_IMAGE}" "${DATE_IMAGE}"
          podman push --digestfile=/tmp/digest.txt "${DATE_IMAGE}"
          echo "digest=$(cat /tmp/digest.txt)" >> "$GITHUB_OUTPUT"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "### 本次构建"
            echo ""
            echo "- 版本 tag: \`${DATE_TAG}\`"
            echo "- digest: \`$(cat /tmp/digest.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 6. 使用私钥对镜像进行防篡改加密签名
        env:
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE_WITH_DIGEST="${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push_image.outputs.digest }}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_WITH_DIGEST}"

      - name: 7. 回读校验签名
        run: |
          IMAGE_WITH_DIGEST="${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push_image.outputs.digest }}"
          cosign verify --key cosign.pub "${IMAGE_WITH_DIGEST}"

      - name: 8. 验签通过后才移动 :44 tag
        run: |
          podman push "${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
